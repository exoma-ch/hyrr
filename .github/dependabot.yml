version: 2
updates:
  # Git submodules (nucl-parquet)
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # npm (frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  # pip (Python)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"

  # Cargo (Rust crates — no workspace, so each carries its own Cargo.lock).
  # One entry covers all five crate dirs; a catch-all group collapses the
  # week's bumps into a single PR (keeps churn down and plays nice with the
  # lockfile-sync gate). NOTE: core/hyrr-mcp/py/desktop path-depend on the
  # nucl-parquet Rust client (a submodule); if Dependabot can't resolve that
  # path it will error on those dirs — wasm has no submodule dep and always
  # works. Watch the first run and narrow `directories` to /wasm if needed.
  - package-ecosystem: "cargo"
    directories:
      - "/core"
      - "/hyrr-mcp"
      - "/py"
      - "/wasm"
      - "/desktop/src-tauri"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        patterns:
          - "*"
