name: Verify Release

# Post-publish verification (#401).
#
# Every other gate in this repo runs BEFORE publishing. This one asserts that
# the published world matches intent, because three incidents were a green
# pipeline over a wrong reality: a shipped hyrr-mcp with broken data fetch
# (#529), three releases with no aarch64 wheel (#461 — a matrix
# continue-on-error reports SUCCESS to downstream `needs:`), and a stale
# access whitelist (#565).
#
# `release: published` fires reliably here: release-please authenticates with
# the hyrr-release-bot App token, not the default GITHUB_TOKEN, so its tags and
# releases DO trigger workflows (see release-please.yml's header).
#
# The checks retry rather than run once — at `release: published` the wheels and
# the desktop installers have not been built yet. verify-release.sh owns that
# polling so the logic is testable (scripts/tests/test_verify_release.sh).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to verify, e.g. 0.19.0"
        required: true
        type: string
      wait_seconds:
        description: "Seconds to keep retrying while release builds finish"
        required: false
        default: "2700"
        type: string

permissions:
  contents: read

concurrency:
  group: verify-release-${{ inputs.version || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  published-world:
    name: published world matches intent
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          # Tags let verify-release.sh answer locally instead of via the API.
          fetch-depth: 0

      # Via env, not a `${{ }}` interpolation inside run: — a tag name is
      # attacker-influenced in the general case and would otherwise be pasted
      # straight into the shell.
      - name: Resolve version
        id: resolve
        env:
          RAW: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RAW#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$RAW' is not a version this workflow can verify"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Verifying $version"

      - name: Verify tags, latest.json, PyPI artifacts and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
          WAIT: ${{ inputs.wait_seconds || '2700' }}
        run: scripts/verify-release.sh "$VERSION" --wait "$WAIT"

  # The published wheel actually installs and runs, on BOTH architectures.
  # `smoke-test-aarch64` in release-hyrr-mcp.yml tests the artifact before it
  # is uploaded; this tests what a user really gets from PyPI.
  uvx-runs:
    name: uvx runs the published wheel (${{ matrix.arch }})
    needs: published-world
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: astral-sh/setup-uv@v7

      - name: uvx hyrr-mcp@${{ needs.published-world.outputs.version }} --version
        env:
          VERSION: ${{ needs.published-world.outputs.version }}
        run: |
          set -euo pipefail
          # Resolves from PyPI, installs the platform wheel, loads the native
          # PyO3 extension and runs. Exercises the whole FFI boundary — this is
          # the step that would have caught a wheel published for the wrong
          # architecture.
          uvx "hyrr-mcp@${VERSION}" --version

      - name: Assert the installed distribution is the released version
        env:
          VERSION: ${{ needs.published-world.outputs.version }}
        run: |
          set -euo pipefail
          got="$(uvx --from "hyrr-mcp==${VERSION}" python -c \
            'import importlib.metadata as m; print(m.version("hyrr-mcp"))')"
          echo "installed hyrr-mcp: $got"
          if [ "$got" != "$VERSION" ]; then
            echo "::error::PyPI resolved hyrr-mcp $got for a request of $VERSION"
            exit 1
          fi
          # NOTE: hyrr_mcp.__version__ is deliberately NOT asserted here. It
          # comes from py-mcp/Cargo.toml, which release-please does not bump, so
          # the published package reports 0.1.0 from `--version` while its
          # distribution metadata is correct. Tracked in #599; tighten this
          # step to assert both once that is fixed.
