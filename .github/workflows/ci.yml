name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref — a re-push (or a release-please
# rewrite) shouldn't leave the old run hogging a runner slot (#484).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── The merge gate: one hermetic `nix flake check` ─────────────────────
  # Replaces the old per-job cargo matrix (rust-projectile-matrix,
  # embedded-data-store, mcp-tools, hyrr-py-check, data-fetch-integration,
  # data-fetch-ssot, release-workflow-guards). Every one of those is now a
  # `checks.*` derivation in flake.nix — built identically here and on a
  # laptop (`nix flake check`), deps vendored from Cargo.lock, the
  # nucl-parquet data a pinned flake input (no submodule init needed), the
  # whole thing cached so unchanged inputs are hits (#484 Part A).
  nix-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: DeterminateSystems/nix-installer-action@v22
      # Cache the /nix/store (toolchain, vendored crates, the ~650 MB
      # nucl-parquet input, built check outputs) across runs via the GitHub
      # Actions cache — kills the "rebuild everything every run" tax. Keyed on
      # the lockfile + flake/Cargo inputs so it busts only on real changes.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', '**/Cargo.lock', 'core/Cargo.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Cap GC so the cache stays under the repo budget.
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - name: nix flake check (all hermetic gates)
        run: nix flake check -L

  # ── Lint: the prek SSoT (network — prek fetches/builds remote hook envs) ─
  # Can't be a hermetic check (prek downloads yamllint/shellcheck/pymarkdown
  # repos + builds their language envs), so it stays a thin cached job. Runs
  # the exact same `prek run --all-files` as local dev. (#159)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-lint-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-lint-${{ runner.os }}-
      - name: Lint (prek run --all-files via flake)
        run: nix develop .#ci --command prek run --all-files --show-diff-on-failure

  # ── Python tests (cached job) ──────────────────────────────────────────
  # Not hermetic: the suite leans on internal packages
  # (pycatima / py-materials / nucl-parquet) that have no public wheels, so a
  # uv2nix venv isn't worth the thrash — and the physics it exercises is
  # already hermetic-tested in Rust (`nix flake check`). Uses the flake-pinned
  # Python 3.12 + uv, so `nix develop .#ci -c pytest` reproduces it locally.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Init nucl-parquet submodule (sparse)
        run: |
          git submodule update --init --depth 1 --filter=blob:none nucl-parquet
          cd nucl-parquet
          git sparse-checkout set docs/security data/meta data/stopping data/tendl-2023-iso/xs
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-test-${{ runner.os }}-${{ hashFiles('flake.lock', 'uv.lock') }}
          restore-prefixes-first-match: nix-test-${{ runner.os }}-
      - name: Test (uv + pytest via flake, Python 3.12)
        run: |
          nix develop .#ci --command bash -c '
            uv sync --dev
            uv run pytest tests/ --cov --benchmark-disable --ignore=tests/integration
          '

  # ── Lockfile sync (uv.lock / wasm Cargo.lock vs their manifests) ────────
  # Not a hermetic check: `uv lock --check` + `cargo check --locked` resolve /
  # compile against the network. Cheap, so it stays a standalone job.
  lockfile-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # cargo needs the nucl-parquet Rust client on disk to resolve the
      # core/hyrr-mcp/py/desktop -> nucl-parquet path-dep chain (default features
      # pull parquet-store; wasm doesn't, so this wasn't needed before). Sparse:
      # client only.
      - name: Init nucl-parquet submodule (sparse — Rust client only)
        run: |
          git submodule update --init --depth 1 --filter=blob:none nucl-parquet
          cd nucl-parquet
          git sparse-checkout set clients/rs/nucl-parquet
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check lockfiles in sync
        run: bash scripts/check-lockfiles.sh

  # ── ts-rs binding drift gate (config codec, #539) ──────────────────────
  # The canonical TypeScript config-codec types
  # (packages/compute/src/generated/config-codec.ts) are GENERATED from the Rust
  # structs in hyrr-core::config_codec via `ts_rs::TS`. This job regenerates them
  # and `git diff --exit-code`s the path — so the committed types can never
  # silently drift from the Rust source of truth (the hand-mirror drift class
  # #531 belongs to). Deliberately NOT a `nix flake check` derivation: ts-rs
  # writes files during `cargo test`, which fights the read-only nix sandbox, so
  # the `ts` feature is off in every hermetic check and the generation lives here
  # as a thin standalone job (like lockfile-sync). Cheap: `--lib
  # --no-default-features` builds only hyrr-core's lib with the codec (no
  # arrow/parquet/data), so no nuclear-data checkout is needed to build.
  ts-bindings-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # cargo needs the nucl-parquet Rust client on disk to resolve the
      # core -> nucl-parquet optional path-dep (even deactivated under
      # --no-default-features, the manifest must exist). Sparse: client only.
      - name: Init nucl-parquet submodule (sparse — Rust client only)
        run: |
          git submodule update --init --depth 1 --filter=blob:none nucl-parquet
          cd nucl-parquet
          git sparse-checkout set clients/rs/nucl-parquet
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate TS bindings from the Rust source of truth
        run: |
          REGEN_TS=1 cargo test --manifest-path core/Cargo.toml \
            --lib --no-default-features --features ts \
            ts_bindings_match_committed
      - name: Fail if the generated TS types drifted
        run: |
          git diff --exit-code packages/compute/src/generated/ \
            || { echo "::error::Generated config-codec.ts is stale. Regenerate with \`REGEN_TS=1 cargo test --manifest-path core/Cargo.toml --lib --no-default-features --features ts ts_bindings_match_committed\` and commit."; exit 1; }

  # ── Shell-script tests (bash) ──────────────────────────────────────────
  # These cover the guards that protect releases and deploys: the #572
  # release-notes gate, and the #401 deploy/release verification. They ran
  # nowhere until now — neither CI nor prek — which made them documentation
  # rather than guards.
  #
  # No network and no secrets: gh and curl are stubbed onto PATH, and the
  # deploy checks are driven against a local http.server.
  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Run scripts/tests
        run: scripts/tests/run-all.sh

  # ── Supplier catalog freshness (warn-only, node) ───────────────────────
  supplier-catalog-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Warn if supplier catalog is stale (>90 days)
        run: node frontend/scripts/check-suppliers-fresh.mjs
