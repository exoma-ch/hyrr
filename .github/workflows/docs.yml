# PR-time validation ONLY — this workflow publishes nothing.
#
# WARNING: nothing else publishes the docs either. The deploy used to live in
# `promote-to-prod.yml`, which was DELETED with the ETH deploy ladder (#489),
# and `deploy-frontend.yml` then replaced the gh-pages content with the public
# landing page. https://exoma-ch.github.io/hyrr/docs/ 404s today. Tracked in
# #637.
#
# So a green check here proves the docs BUILD, not that anyone can read them.
# Do not read this passing as "the docs site is fine".
name: Validate docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[docs]"
      - name: Build docs (validation only)
        run: mkdocs build -d site
