[package]
name = "hyrr-desktop"
version = "0.8.0"
description = "HYRR Desktop — offline nuclear data simulation"
edition = "2021"
# Every sibling crate (core, py, py-mcp, hyrr-mcp, wasm) declares this; the
# desktop crate was the one that didn't, so the repo shipped an undeclared
# licence on the artifact users actually install. Surfaced by cargo-deny (#580).
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyrr-core = { path = "../../core", features = ["mcp", "embed-data", "trace-jsonl"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
