[package]
name = "hyrr-mcp"
version = "0.21.1"
edition = "2021"
description = "HYRR MCP server — stdio JSON-RPC for radio-isotope production queries"
license = "MIT"

[[bin]]
name = "hyrr-mcp"
path = "src/main.rs"

[dependencies]
# hyrr-core carries the canonical data-fetch path (#529 fix): DATA_VERSION
# derives from the pinned nucl-parquet submodule's catalog.json at build
# time — the single source of truth for the release tag / URL / cache dir —
# and FetchError surfaces network/404 failures loudly instead of continuing
# with a half-populated cache. hyrr-core transitively brings in the
# nucl-parquet crate via its `parquet-store` feature, without the `fetch`
# feature (we no longer use `nucl_parquet::DataDir::ensure_lazy`).
hyrr-core = { path = "../core", features = ["mcp", "trace-jsonl"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
# `panic = "unwind"` (the default, spelled out here to override an earlier
# `abort` setting) so `std::panic::catch_unwind` at the MCP dispatch boundary
# actually works in shipped binaries — see
# `hyrr_core::mcp::transport::handle_request` (#712 review, #355). A long-lived
# stdio server surviving a tool-level panic is worth the small size / perf
# cost of an unwind ABI; WASM keeps `abort` in its own profile.
panic = "unwind"
